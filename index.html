<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Event Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    🎯 Smart Event Dashboard
  </header>


  <div class="main">
    <div class="card">

      <h2>Add New Event</h2>
      <form id="eventForm">
        <label>Event Title</label>
        <input type="text" id="title" required>
        <label>Event Date</label>
        <input type="date" id="date" required>
        <label>Category</label>
        <select id="category">
          <option>Conference</option>
          <option>Sports</option>
          <option>College</option>
          <option>Personal</option>
        </select>
        <label>Description</label>
        <textarea id="desc"></textarea>
        <button type="submit" class="btn-main">Add Event</button>
      </form>
    </div>

 
    <div class="card big">
      <h2>My Events</h2>
      <div class="btn-group">
        <button id="clearBtn">Clear All Events</button>
        <button id="sampleBtn">Add Sample Events</button>
      </div>

      <p id="empty">No events yet. Add your first event!</p>
      <div id="eventList"></div>
    </div>
  </div>


  <div class="card dom">

    <h2>DOM Manipulation Demo</h2>

    <input type="text" id="demoInput"
      placeholder="Press any key to see the difference!">
    <p id="demoText"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
